name: Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          KIDS_NO_PROMPT: '1'
        run: python -m unittest discover -s tests -v
      - name: Build installer
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name TechnoLabKids_Setup --icon "$pwd/Windows/panther.ico" --paths "$pwd" --hidden-import setup_wizard --distpath dist --workpath build --specpath build main.py
      - name: Checksum
        run: (Get-FileHash dist/TechnoLabKids_Setup.exe -Algorithm SHA256).Hash + '  TechnoLabKids_Setup.exe' | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kids-Companion-0.3.0-Windows
          path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.0 *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host 'Release already exists; build is available as workflow artifact.'; exit 0 }
          gh release create v0.3.0 dist/TechnoLabKids_Setup.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Kids Companion 0.3.0' --notes-file CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

